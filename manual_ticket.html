<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>ออกตั๋วแมนนวลเสมือนจริง (WYSIWYG Ticket)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background: radial-gradient(circle at top, #e2e8f0, #cbd5e1);
            color: #000;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        .ticket-page {
            width: 198mm;
            min-height: 125mm;
            margin: 90px auto;
            background: #fff;
            padding: 5mm;
            position: relative;
            border-radius: 0;
            border: 1.2px solid #000;
            display: flex;
            flex-direction: column;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Header ── */
        .header-outer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }


        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box {
            width: 100px;
            height: 110px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://lh3.googleusercontent.com/d/1C6xZIU7N3LQ3-Bcs8cffuqg4jykUkE-y');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 0;
            background-color: transparent;
        }

        /* สำหรับหน้า Manual ปกติ (หน้าเว็บ) ให้ใช้ top: 60px เพื่อให้ภาพแรกดูดี */
        .ticket-logo {
            position: absolute;
            top: 55px;
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .title-box {
            padding-top: 0px;
        }

        .title-box h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: #1e3a8a;
            letter-spacing: 1px;
        }

        .title-box p {
            font-size: 16px;
            margin: 2px 0;
            color: #475569;
            font-weight: 600;
        }

        .p {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-top: 20px;
            margin-left: 65px;
            line-height: 1;
        }

        .title-main {
            font-size: 20px;
            font-weight: 800;
            color: #3B4C6B;
            display: inline-block;
            line-height: 1;
            margin-top: 4px;
            margin-left: 65px;
        }

        .header-right {
            text-align: right;
        }

        .copy-info {
            font-size: 14px;
            font-style: italic;
            color: #444;
            font-weight: 600;
        }

        .no-box {
            font-size: 16px;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            color: #000;
            font-weight: 700;
        }

        .no-val {
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 400;
            min-width: 120px;
            text-align: left;
            border: none;
            color: #000;
        }

        .boarding-top {
            color: #000;
            font-weight: 900;
            font-size: 14px;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }

        .boarding-val-manual {
            color: #ef4444;
            margin-left: 5px;
            font-weight: 900;
        }

        /* ── Table Structure ── */
        .ticket-table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #000;
            table-layout: fixed;
            margin-top: 2px;
        }

        .ticket-table td {
            border: 1px solid #000;
            padding: 2px 6px;
            vertical-align: middle;
            height: 26px;
        }

        .td-lbl {
            background: #f8fafc;
        }

        .lbl {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            display: block;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .lbl-en {
            font-size: 9px;
            font-weight: 400;
            color: #333;
            display: block;
        }

        .val-manual {
            font-size: 16px;
            font-weight: 500;
        }

        /* สำหรับแสดงผล คันที่ (สีแดง) ในตั๋ว */
        .extra-trip-label {
            color: #ef4444 !important;
            font-weight: 800 !important;
        }

        .extra-time-label {
            color: #000 !important;
            font-weight: 500 !important;
            margin-left: 4px;
        }

        /* สำหรับแสดงผล คันที่ (สีแดง) ในตั๋ว */
        .extra-trip-label {
            color: #ef4444;
            font-weight: 800;
        }

        .extra-time-label {
            color: #000;
            font-weight: 500;
            margin-left: 4px;
        }

        /* ── Payment Section ── */
        .payment-cell {
            padding: 0 !important;
        }

        .payment-mini-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: none;
        }

        .payment-mini-label {
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 800;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.15;
            text-align: left;
        }

        .payment-mini-value {
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 500;
            color: #000;
            line-height: 1.15;
            text-align: center;
        }



        .payment-inner {
            display: flex;
            flex-direction: column;
            border-left: 2px solid #000;
            height: 100%;
        }

        .payment-row {
            display: flex;
            align-items: center;
            padding: 2px 12px;
            border-bottom: 1px solid #000;
            font-size: 15px;
            font-weight: 400;
            height: 50%;
        }

        .payment-row span:first-child {
            width: 95px;
            flex-shrink: 0;
            color: #1e3a8a;
            font-size: 13px;
        }

        .payment-row:last-child {
            border-bottom: none;
        }

        .check-box {
            width: 18px;
            height: 18px;
            border: 1.5px solid #000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            cursor: pointer;
            flex-shrink: 0;
        }

        .check-box.checked {
            background: #334155;
        }

        .check-box.checked::after {
            content: '✔';
            font-size: 12px;
            color: #fff;
        }

        /* ── Coupon Section ── */
        .coupon-section {
            margin-top: 1px;
            border-top: 1px dashed #000;
            background: #fff;
            padding-top: 0px;
        }

        .coupon-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .coupon-table td {
            padding: 0px 8px;
            vertical-align: middle;
            border: none !important;
            line-height: 1.1;
            height: 24px;
        }

        .c-header-row {
            background: #f1f5f9;
        }

        .c-label {
            font-size: 10px;
            font-weight: 400;
            color: #1f2937;
            display: inline-block;
        }

        .c-val {
            font-size: 10px;
            font-weight: 800;
            color: #000;
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
        }

        .c-seat-val {
            font-size: 10px;
            font-weight: 800;
            color: #000;
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
        }

        .coupon-table td.center {
            text-align: center;
        }

        .coupon-table tr:last-child td {
            padding-top: 1px;
            padding-bottom: 1px;
        }

        .coupon-table td.coupon-data-left {
            text-align: left;
            padding-left: 8px;
            padding-right: 8px;
        }

        .coupon-table [id^="cp-price-"] {
            font-weight: 800 !important;
        }

        .subtitle {
            font-size: 17px;
            font-weight: 500;
            color: #000;
            margin-bottom: -3px;
            margin-top: -4px;
        }

        .c-warning {
            font-size: 10px;
            color: #dc2626;
            font-weight: 800;
            text-align: center;
            padding: 0px;
            background: #f3f4f6;
            border-top: 1px dashed #000;
        }

        /* ── Row Table (for date/platform rows) ── */
        .row-table {
            width: 100%;
            border-collapse: collapse;
        }

        .row-table td {
            border: none;
            border-right: 1px solid #000;
            padding: 5px 10px;
        }

        .row-table td:last-child {
            border-right: none;
        }

        /* ── WYSIWYG Inputs ── */
        .wg-input {
            width: 100%;
            border: none;
            padding: 0 2px;
            font-size: 14px;
            font-family: 'Noto Sans Thai', sans-serif;
            transition: 0.2s;
            outline: none;
            background: transparent;
            color: #000;
            font-weight: 400 !important;
            opacity: 1;
        }

        .wg-input[readonly] {
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            font-weight: 400 !important;
            color: #000;
            box-shadow: none !important;
            cursor: default;
            opacity: 1;
        }

        .wg-input:focus {
            background: #f1f5f9;
        }

        .center {
            text-align: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .wg-input.center {
            text-align: center !important;
            padding: 0 !important;
            width: 100% !important;
        }

        .wg-input:focus {
            background: #f1f5f9;
            font-weight: 400 !important;
        }

        .wg-input::placeholder {
            color: #94a3b8;
            font-weight: normal;
        }

        /* Ultimate Override for all data fields */
        .ticket-table input,
        .ticket-table span.c-val,
        .ticket-table span.c-seat-val,
        .no-val input,
        .no-val span,
        .wg-input {
            font-weight: 400 !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* ── Footer Actions ── */
        .footer-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            box-shadow: 0 -15px 50px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .footer-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-add {
            background: rgba(255, 255, 255, 0.1);
            border: 1px dashed rgba(255, 255, 255, 0.4);
        }

        .btn-add:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .btn-download {
            background: #475569;
        }

        .btn-download:hover {
            background: #334155;
        }

        .btn-print {
            background: #0284c7;
        }

        .btn-print:hover {
            background: #0369a1;
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981, #059669);
            font-size: 16px;
            padding: 12px 35px;
        }

        .btn-save:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }

        .toast.error {
            background: #ef4444;
        }

        .toast.success {
            background: #10b981;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 10px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 5px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Controls inside Ticket — Hidden by default, show on hover ── */
        .btn-remove,
        .btn-fetch-inner {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .ticket-page:hover .btn-remove,
        .ticket-page:hover .btn-fetch-inner,
        .ticket-page:hover .btn-save-mini {
            opacity: 1;
        }

        /* ── Action Buttons ── */
        .btn-save-mini {
            background: #10b981;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transition: 0.3s;
            margin-left: auto;
        }

        .btn-save-mini:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        /* ── Remove Button ── */
        .btn-remove {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 32px;
            height: 32px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            z-index: 20;
        }

        .btn-remove:hover {
            background: #b91c1c;
            transform: scale(1.1);
        }

        .btn-fetch-inner {
            background: #3b82f6;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-fetch-inner:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* ── Custom Confirmation Modal ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-card {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-card h3 {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .modal-card p {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            font-size: 14px;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
        }

        /* ── Watermark CANCELLED ── */
        .cancelled-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 80px;
            font-weight: 900;
            color: rgba(239, 68, 68, 0.25);
            border: 8px solid rgba(239, 68, 68, 0.25);
            padding: 10px 40px;
            border-radius: 30px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
            display: none;
        }

        .btn-confirm-red {
            background: #ef4444;
            color: white;
        }

        .btn-confirm-red:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* ── Print Settings ── */
        @page {
            size: A5 landscape;
            margin: 2mm;
            /* ลดขอบกระดาษลงเพื่อให้มีพื้นที่แนวตั้งมากขึ้น */
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                min-height: auto !important;
                height: auto !important;
            }

            .ticket-page {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: always !important;
                margin: 0 auto !important;
                width: 198mm !important;
                /* ลดความกว้างลง เพื่อให้สัดส่วนตั๋วเล็กลง (ลดการขยาย) */
                min-height: auto !important;
                /* ปลดล็อคความสูงขั้นต่ำ จะได้ไม่โดนดันตกขอบ */
                height: auto !important;
                padding: 2mm !important;
                /* ลด Padding ให้ประหยัดพื้นที่แนวตั้ง */
                border: none !important;
                /* ❌ เอากรอบสีดำที่หุ้มตั๋วออกตามที่ต้องการ */
                box-shadow: none !important;
                transform: none !important;
                display: block !important;
            }

            .ticket-logo {
                top: 45px !important;
            }

            /* ย่อความสูงของตารางลงนิดหน่อยเฉพาะตอนปริ้น เพื่อให้อัดพอดี 1 หน้าเป๊ะๆ */
            .ticket-table {
                margin-top: 0px !important;
            }

            .ticket-table td {
                height: 22px !important;
                padding: 1px 4px !important;
            }

            .coupon-section {
                margin-top: 0px !important;
                padding-top: 0px !important;
            }

            .coupon-table td {
                height: 20px !important;
                padding: 0px 4px !important;
            }

            .print-hidden {
                display: none !important;
            }

            /* ซ่อนสิ่งที่ไม่เกี่ยวข้องกับการพิมพ์ */
            .footer-actions,
            .btn-remove,
            .btn-fetch-inner,
            .ticket-selector,
            .no-print,
            .toast,
            .overlay,
            .modal-overlay,
            #tickets-wrapper>div:not(.ticket-page) {
                display: none !important;
            }

            /* ปรับช่องกรอกข้อมูลให้ดูเหมือนตัวหนังสือปกติ */
            .wg-input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                box-shadow: none !important;
                color: black !important;
                font-size: 15px !important;
                font-weight: 400 !important;
            }

            .remark-val {
                color: #ef4444 !important;
            }

            .no-val {
                border: none !important;
                background: transparent !important;
                box-shadow: none !important;
                padding: 0 !important;
            }

            .td-lbl {
                background-color: #f1f5f9 !important;
            }

            .logo-box {
                background-image: url('https://lh3.googleusercontent.com/d/1C6xZIU7N3LQ3-Bcs8cffuqg4jykUkE-y') !important;
            }
        }

        /* ── Export Mode (For Image Download) ── */
        body.export-mode {
            background: white !important;
        }

        body.export-mode .ticket-page {
            width: 210mm !important;
            height: 148mm !important;
            margin: 0 auto !important;
            border: none !important;
            box-shadow: none !important;
            padding: 10px !important;
            transform: none !important;
        }

        body.export-mode .btn-remove,
        body.export-mode .btn-card-action,
        body.export-mode .btn-fetch-inner,
        body.export-mode .toast,
        body.export-mode .footer-actions {
            display: none !important;
        }

        body.export-mode .wg-input {
            border: none !important;
            background: transparent !important;
            padding: 2px 0 !important;
            box-shadow: none !important;
            color: black !important;
            font-weight: 400 !important;
            -webkit-text-fill-color: black !important;

            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.className = `toast show ${type}`;
            setTimeout(() => t.className = 'toast', 4000);

        // Guard: ถ้าเปิดไฟล์ HTML ตรงๆ นอก Google Apps Script Web App
        function isAppsScriptReady() {
            return typeof google !== 'undefined' && google.script && google.script.run;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ticketIdFromServer = "<?= id ?>";
            if (ticketIdFromServer) {
                fetchTicketData(ticketIdFromServer);
            } else {

        });

        function fetchTicketData(id) {
            const ticketId = id || document.getElementById('f-ticket-no-master')?.value.trim();
            if (!ticketId) return;

            if (!isAppsScriptReady()) {
                showToast('ไม่พบ `google.script.run` (เปิดหน้านี้ไม่ได้แบบไฟล์เดี่ยว) โปรดเปิดผ่าน Web App เท่านั้น', 'error');
                return;
            }

            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';

            google.script.run.withSuccessHandler(res => {
                overlay.style.display = 'none';
                if (res && res.success) {
                    const tickets = res.isGroup ? res.tickets : [res];
                    renderTickets(tickets);
                } else {
                    showToast(res ? res.error : 'ไม่พบข้อมูล', 'error');
                }
            }).getTicketData(ticketId);
        }

            tickets.forEach(t => {
                const seats = t.seatId ? t.seatId.toString().split(/[\s,]+/).filter(s => s.trim() !== "") : [];

                    const totalBasePrice = parseFloat(t.price) || 0;
                    const pricePerSeat = Math.floor(totalBasePrice / seats.length);

                    seats.forEach(s => {
                        splitTickets.push({
                            ...t,
                            seatId: s,
                            price: pricePerSeat
                        });
                    });
                } else {
                    splitTickets.push(t);
                }
            });

        function fillTicketValues(t, idx) {
            let idDisp = t.ticketId || t.ticketNo || '';
            if (idDisp.startsWith('online00')) {
                idDisp = idDisp.replace('online00', '');
            }

            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.value = val || '';
            };

            const setText = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.textContent = val || '-';
            };

            setVal(`f-no-${idx}`, idDisp);
            setVal(`f-name-${idx}`, t.name);
            setVal(`f-phone-${idx}`, t.phone);
            setVal(`f-from-${idx}`, t.origin || t.from);
            setVal(`f-to-${idx}`, t.destination || t.to);
            setVal(`f-boarding-${idx}`, t.boarding);
            setVal(`f-platform-${idx}`, t.platform);
            setVal(`f-bus-${idx}`, t.busNo);
            setVal(`f-seat-${idx}`, t.seatId);
            setVal(`f-price-${idx}`, t.price);
            setVal(`f-issuer-${idx}`, t.issuedBy);
            setVal(`f-issued-date-${idx}`, t.issuedDate || t.date);
            let remarkText = t.remarks || t.remark || '';
            if (remarkText.includes('ตั๋วใบนี้ถูกยกเลิกแล้ว')) {
                remarkText = remarkText.replace('ตั๋วใบนี้ถูกยกเลิกแล้ว', '').trim();
            }
            setVal(`f-remark-${idx}`, remarkText);

            const remarkInp = document.getElementById(`f-remark-${idx}`);
            if (remarkInp) {
                remarkInp.style.color = 'red';
                remarkInp.style.fontWeight = 'normal';
            }
            setText(`f-boarding-disp-${idx}`, t.boarding);

            setText(`cp-no-${idx}`, t.ticketNo || (idDisp ? "online00" + idDisp : '-'));
            setText(`cp-name-${idx}`, t.name);
            setText(`cp-phone-${idx}`, t.phone);
            setText(`cp-from-${idx}`, t.origin || t.from);
            setText(`cp-to-${idx}`, t.destination || t.to);
            setText(`cp-date-${idx}`, t.date || (t.day ? `${t.day}/${t.month}/${t.year}` : '-'));

            let timeStr = t.time || '-';
            if (timeStr !== '-' && !timeStr.includes('(เวลาต้นทาง)')) {
                timeStr += ' (เวลาต้นทาง)';
            }

            const cpTimeEl = document.getElementById(`cp-time-${idx}`);
            if (cpTimeEl) {
                if (timeStr.includes("คันที่")) {
                    const parts = timeStr.split('(');
                    if (parts.length > 1) {
                        const busPart = parts[0].trim();
                        const timePart = "(" + parts.slice(1).join('(');
                        cpTimeEl.innerHTML = `<span class="extra-trip-label">${busPart}</span><span class="extra-time-label">${timePart}</span>`;
                    } else {
                        cpTimeEl.innerHTML = `<span class="extra-trip-label">${timeStr}</span>`;
                    }
                } else {
                    cpTimeEl.textContent = timeStr;
                }
            }

            setText(`cp-seat-${idx}`, t.seatId);

            const pType = (t.paymentType || '').toLowerCase();
            const isAgentData = t.isAgent || pType === 'agent' || pType === 'เอเย่นต์' || (t.agentName && t.agentName !== '');

            const cpRemarkText = t.remarks || t.remark || '';
            const cpRemarkEl = document.getElementById(`cp-remark-${idx}`);
            if (cpRemarkEl) {
                cpRemarkEl.textContent = cpRemarkText;
                cpRemarkEl.style.color = 'red';
                cpRemarkEl.style.fontWeight = 'normal';
            }

            if (isAgentData) {
                const agentPriceStr = `${t.price} (A)`;
                setText(`cp-price-${idx}`, agentPriceStr);

                const mainPriceInp = document.getElementById(`f-price-${idx}`);
                if (mainPriceInp) {
                    mainPriceInp.value = agentPriceStr;
                    mainPriceInp.style.color = '#2563eb';
                    mainPriceInp.style.fontWeight = '300';
                }

                const cpPriceEl = document.getElementById(`cp-price-${idx}`);
                if (cpPriceEl) {
                    cpPriceEl.style.color = '#000000';
                    cpPriceEl.style.fontWeight = '400';
                }
            } else {
                setText(`cp-price-${idx}`, t.price);

                const mainPriceInp = document.getElementById(`f-price-${idx}`);
                if (mainPriceInp) {
                    mainPriceInp.value = t.price;
                    mainPriceInp.style.color = '#000000';
                    mainPriceInp.style.fontWeight = '300';
                }

                const cpPriceEl = document.getElementById(`cp-price-${idx}`);
                if (cpPriceEl) {
                    cpPriceEl.style.color = '#000000';
                    cpPriceEl.style.fontWeight = '300';
                }
            }

            let payMethod = '-';
            if (t.isCash) payMethod = '💵 เงินสด';
            else if (t.isQR) payMethod = '📱 QR-code';
            else if (t.isCard) payMethod = '💳 บัตร';
            else if (t.isInspector) payMethod = '🎫 บัตรตรวจฯ';

            let typeText = '-';
            if (isAgentData) {
                typeText = '👤 เอเย่นต์';
            } else if (t.isCard || pType === 'ราคาบัตร') {
                typeText = '💳 ราคาบัตร';
            } else if (t.isInspector || pType === 'ตรวจการ' || pType === 'inspector') {
                typeText = '👮 ตรวจการ';
            } else if (t.isCash || t.isQR || pType === 'cash' || pType === 'qr') {
                typeText = '🎫ปกติ';
            }

            const typeEl = document.getElementById(`m-pay-type-val-${idx}`);
            if (typeEl) {
                typeEl.textContent = typeText;
                if (isAgentData) typeEl.style.color = '#2563eb';
                else typeEl.style.color = '#000000';
            }

            const methodEl = document.getElementById(`m-pay-method-val-${idx}`);
            if (methodEl) methodEl.textContent = payMethod;

            const watermarkStamp = document.getElementById(`cancelled-stamp-${idx}`);
            const status = (t.status || '').toUpperCase();

            if (status === 'CANCELLED') {
                if (watermarkStamp) watermarkStamp.style.display = 'block';
            } else {
                if (watermarkStamp) watermarkStamp.style.display = 'none';
            }

            if (t.day && t.month && t.year) {
                const y = toGregorian(t.year);
                const mm = t.month.toString().padStart(2, '0');
                const dd = t.day.toString().padStart(2, '0');
                const yy = (y + 543).toString().slice(-2);
                const dateInp = document.getElementById(`f-date-${idx}`);
                if (dateInp) dateInp.value = `${y}-${mm}-${dd}`;

                const dateDisp = document.getElementById(`f-date-display-${idx}`);
                if (dateDisp) dateDisp.value = `${dd}/${mm}/${yy}`;
            } else if (t.date && t.date.includes('/')) {
                const parts = t.date.split('/');
                if (parts.length === 3) {
                    const y = toGregorian(parts[2]);
                    const mm = parts[1].padStart(2, '0');
                    const dd = parts[0].padStart(2, '0');
                    const yy = (y + 543).toString().slice(-2);
                    const dateInp = document.getElementById(`f-date-${idx}`);
                    if (dateInp) dateInp.value = `${y}-${mm}-${dd}`;

                    const dateDisp = document.getElementById(`f-date-display-${idx}`);
                    if (dateDisp) dateDisp.value = `${dd}/${mm}/${yy}`;
                }
            }
            const timeVal = t.time || '';
            const timeDisplay = document.getElementById(`f-time-display-${idx}`);
            const timeHidden = document.getElementById(`f-time-${idx}`);

            if (timeDisplay) {
                if (timeVal.includes("คันที่")) {
                    const parts = timeVal.split('(');
                    if (parts.length > 1) {
                        const busPart = parts[0].trim();
                        const timePart = "(" + parts.slice(1).join('(');
                        timeDisplay.innerHTML = `<span class="extra-trip-label">${busPart}</span><span class="extra-time-label">${timePart}</span>`;
                    } else {
                        timeDisplay.innerHTML = `<span class="extra-trip-label">${timeVal}</span>`;
                    }
                } else {
                    timeDisplay.textContent = timeVal;
                }
            }
            if (timeHidden) timeHidden.value = timeVal;

        }

        function updateOtherPayment(idx) {
            const sel = document.getElementById(`f-pay-other-selector-${idx}`);
            const cb = document.getElementById(`m-pay-other-cb-${idx}`);
            if (sel.value !== "" && cb) {
                cb.classList.add('checked');
            } else if (cb) {
                cb.classList.remove('checked');
            }
        }

        function toGregorian(y) {
            let yr = parseInt(y);
            if (yr < 100) yr += 2500;
            if (yr > 2400) yr -= 543;
            return yr;
        }

        function togglePayment(idx, type) {
            const el = document.getElementById(`m-pay-${type}-${idx}`);
            if (el) {
                el.classList.toggle('checked');
            }

            const isAgent = document.getElementById(`m-pay-agent-${idx}`).classList.contains('checked');
            const isInsp = document.getElementById(`m-pay-inspector-${idx}`).classList.contains('checked');

            const agentLbl = document.getElementById(`agent-label-cell-${idx}`);
            const agentInp = document.getElementById(`agent-input-cell-${idx}`);
            const issuerLbl = document.getElementById(`issuer-label-cell-${idx}`);
            const issuerInp = document.getElementById(`issuer-input-cell-${idx}`);

            if (isAgent || isInsp) {
                agentLbl.style.display = 'table-cell';
                agentInp.style.display = 'table-cell';
                issuerLbl.style.display = 'none';
                issuerInp.style.display = 'none';
            } else {
                agentLbl.style.display = 'none';
                agentInp.style.display = 'none';
                issuerLbl.style.display = 'table-cell';
                issuerInp.style.display = 'table-cell';
            }
        }

        function prepareTicketForExport(originalCard) {
            const clone = originalCard.cloneNode(true);

            clone.querySelectorAll('.btn-remove, .btn-fetch-inner, .btn-card-action, .btn-remove-inner, .ticket-selector').forEach(el => el.remove());

            const inputs = clone.querySelectorAll('input, select');
            inputs.forEach(inp => {
                const originalInp = originalCard.querySelector(`#${inp.id}`);
                if (!originalInp) return;

                const val = originalInp.value || '';
                const isHidden = window.getComputedStyle(originalInp).display === 'none' || originalInp.type === 'hidden' || originalInp.style.display === 'none';

                if (isHidden) {
                    inp.remove();
                    return;
                }

                const span = document.createElement('span');
                span.textContent = val;

                const computedStyle = window.getComputedStyle(originalInp);
                span.style.cssText = inp.style.cssText;
                span.style.display = 'block';
                span.style.width = '100%';
                span.style.textAlign = computedStyle.textAlign || 'center';
                span.style.fontWeight = '500';
                span.style.fontFamily = "'Noto Sans Thai', sans-serif";
                span.style.fontSize = computedStyle.fontSize || '18px';
                span.style.color = computedStyle.color || 'black';
                span.style.lineHeight = '1';
                span.style.padding = '0';

                if (inp.id.includes('f-price')) {
                    span.style.fontSize = '18px';
                    span.style.fontWeight = '700';
                    span.style.color = '#1e3a8a';
                }

                if (inp.id.includes('f-platform')) {
                    span.style.fontSize = '18px';
                    span.style.fontWeight = '700';
                }

                inp.parentNode.replaceChild(span, inp);
            });

            clone.style.transform = 'none';
            clone.style.transition = 'none';
            clone.style.animation = 'none';
            clone.style.boxShadow = 'none';
            clone.style.border = 'none';
            clone.style.background = '#ffffff';
            clone.style.margin = '0';
            clone.style.borderRadius = '0';
            clone.style.width = `${originalCard.offsetWidth}px`;
            clone.style.minHeight = `${originalCard.offsetHeight}px`;

            clone.querySelectorAll('.ticket-table td').forEach(td => {
                td.style.border = '1.3px solid #000';
            });
            clone.querySelectorAll('.payment-mini-table').forEach(table => {
                table.style.borderCollapse = 'collapse';
                table.style.borderSpacing = '0';
            });
            clone.querySelectorAll('.payment-mini-table td').forEach(td => {
                td.style.border = 'none';
                td.style.boxSizing = 'border-box';
            });
            clone.querySelectorAll('.payment-mini-table .payment-mini-label').forEach(td => {
                td.style.borderRight = '1.6px solid #000';
            });
            clone.querySelectorAll('.payment-mini-table tr:first-child .payment-mini-label, .payment-mini-table tr:first-child .payment-mini-value').forEach(td => {
                td.style.borderBottom = '1.6px solid #000';
            });

            return clone;
        }

        async function downloadCombinedImage() {
            let cards = Array.from(document.querySelectorAll('.ticket-page'));
            const selectedCards = cards.filter(c => {
                const idx = c.dataset.index;
                return document.getElementById(`chk-${idx}`).checked;
            });

            if (selectedCards.length === 0) {
                showToast('กรุณาเลือกตั๋วอย่างน้อย 1 ใบ', 'error');
                return;
            }

            showToast(`กำลังรวมรูปภาพ ${selectedCards.length} ใบ...`, 'info');

            const captureArea = document.createElement('div');
            captureArea.style.position = 'fixed';
            captureArea.style.top = '-20000px';
            captureArea.style.left = '0';
            captureArea.style.width = 'fit-content';
            captureArea.style.display = 'flex';
            captureArea.style.flexDirection = 'column';
            captureArea.style.gap = '20px';
            captureArea.style.padding = '0';
            captureArea.style.background = '#ffffff';
            document.body.appendChild(captureArea);

            for (let card of selectedCards) {
                const exportNode = prepareTicketForExport(card);
                captureArea.appendChild(exportNode);
            }

            try {
                const targetWidth = captureArea.scrollWidth;
                const targetHeight = captureArea.scrollHeight;
                const canvas = await html2canvas(captureArea, {
                    scale: 4,
                    useCORS: true,
                    backgroundColor: '#f1f5f9',
                    logging: false,
                    width: targetWidth,
                    height: targetHeight,
                    windowWidth: targetWidth,
                    windowHeight: targetHeight
                });

                const link = document.createElement('a');
                const name = selectedCards[0].querySelector('[id^="f-name-"]').value || 'Group';
                link.download = `Tickets_Group_${name}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('ดาวน์โหลดรูปภาพรวมสำเร็จ');
            } catch (err) {
                console.error(err);
                showToast('เกิดข้อผิดพลาดในการรวมรูป', 'error');
            } finally {
                captureArea.remove();
            }
        }

        async function downloadImage() {
            let cards = Array.from(document.querySelectorAll('.ticket-page'));
            const selectedCards = cards.filter(c => {
                const idx = c.dataset.index;
                return document.getElementById(`chk-${idx}`).checked;
            });

            if (selectedCards.length === 0) {
                showToast('กรุณาเลือกตั๋วอย่างน้อย 1 ใบ', 'error');
                return;
            }

            showToast(`กำลังเตรียมไฟล์ภาพ ${selectedCards.length} ใบ...`, 'info');

            const captureArea = document.createElement('div');
            captureArea.style.position = 'fixed';
            captureArea.style.top = '-9999px';
            captureArea.style.left = '-9999px';
            document.body.appendChild(captureArea);

            for (let i = 0; i < selectedCards.length; i++) {
                const card = selectedCards[i];
                const exportNode = prepareTicketForExport(card);
                captureArea.appendChild(exportNode);

                try {
                    const targetWidth = exportNode.scrollWidth;
                    const targetHeight = exportNode.scrollHeight;
                    const canvas = await html2canvas(exportNode, {
                        scale: 4,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        imageTimeout: 0,
                        width: targetWidth,
                        height: targetHeight,
                        windowWidth: targetWidth,
                        windowHeight: targetHeight
                    });

                    const link = document.createElement('a');
                    const tNo = card.querySelector('[id^="f-no-"]').value || `00${i + 1}`;
                    link.download = `Ticket_${tNo}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    await new Promise(r => setTimeout(r, 500));
                } catch (err) {
                    console.error('Export failed:', err);
                }

                exportNode.remove();
            }

            captureArea.remove();
            showToast('ดาวน์โหลดรูปภาพทั้งหมดที่เลือกสำเร็จ', 'success');
        }

        async function downloadSingleTicket(idx) {
            const card = document.getElementById(`ticket-card-${idx}`);
            if (!card) return;

            showToast('กำลังเตรียมไฟล์ภาพ...', 'info');

            const captureArea = document.createElement('div');
            captureArea.style.position = 'fixed';
            captureArea.style.top = '-10000px';
            document.body.appendChild(captureArea);

            const exportNode = prepareTicketForExport(card);
            captureArea.appendChild(exportNode);

            try {
                const targetWidth = exportNode.scrollWidth;
                const targetHeight = exportNode.scrollHeight;
                const canvas = await html2canvas(exportNode, {
                    scale: 4,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    imageTimeout: 0,
                    width: targetWidth,
                    height: targetHeight,
                    windowWidth: targetWidth,
                    windowHeight: targetHeight
                });

                const link = document.createElement('a');
                const tNo = "online00" + (document.getElementById(`f-no-${idx}`).value || `00${idx + 1}`);
                link.download = `Ticket_${tNo}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('ดาวน์โหลดรูปภาพสำเร็จ');
            } catch (err) {
                showToast('เกิดข้อผิดพลาดในการเซฟรูป', 'error');
            }

            captureArea.remove();
        }

        function printSingleTicket(idx) {
            const card = document.getElementById(`ticket-card-${idx}`);
            if (!card) return;

            const allCards = document.querySelectorAll('.ticket-page');
            allCards.forEach(c => {
                if (c.id !== `ticket-card-${idx}`) c.style.display = 'none';
            });

            window.print();

            allCards.forEach(c => c.style.display = 'block');
        }

        function fetchTicketForCard(idx) {
            let num = document.getElementById(`f-no-${idx}`).value.trim();
            if (!num) return;
            const id = "online00" + num;

            if (!isAppsScriptReady()) {
                showToast('ไม่พบ `google.script.run` (เปิดหน้านี้ไม่ได้แบบไฟล์เดี่ยว) โปรดเปิดผ่าน Web App เท่านั้น', 'error');
                return;
            }

            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';

            google.script.run.withSuccessHandler(res => {
                overlay.style.display = 'none';
                if (res && res.success) {
                    if (res.isGroup && res.tickets.length > 1) {
                        renderTickets(res.tickets);
                        showToast(`ดึงข้อมูลกลุ่มรหัส ${id} เรียบร้อย`);
                    } else {
                        const data = res.isGroup ? res.tickets[0] : res;
                        fillTicketValues(data, idx);
                        const card = document.getElementById(`ticket-card-${idx}`);
                        card.dataset.station = data.station || '';
                        card.dataset.slot = data.slotIndex !== undefined ? data.slotIndex : '';
                        showToast(`ดึงข้อมูลรหัส ${id} สำเร็จ`);
                    }
                } else {
                    showToast('ไม่พบรหัสนี้ในฐานข้อมูล (สามารถกรอกข้อมูลเองเพื่อสร้างตั๋วใหม่ได้)', 'info');
                }
            }).getTicketData(id);
        }

        function togglePrintSelection(idx, checked) {
            const card = document.getElementById(`ticket-card-${idx}`);
            if (card) {
                if (checked) {
                    card.classList.remove('print-hidden');
                    card.style.opacity = '1';
                } else {
                    card.classList.add('print-hidden');
                    card.style.opacity = '0.4';
                }
            }
        }

        function removeTicketCard(idx) {
            showConfirm('ยืนยันการลบ', 'คุณต้องการลบใบตั๋วใบนี้ใช่หรือไม่? ข้อมูลที่ยังไม่ได้บันทึกจะหายไป', () => {
                const card = document.getElementById(`ticket-card-${idx}`);
                if (card) {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.9) translateY(20px)';
                    setTimeout(() => {
                        card.remove();
                        if (document.querySelectorAll('.ticket-page').length === 0) {
                            showToast('ไม่มีใบตั๋วเหลืออยู่ สามารถกด "เพิ่มตั๋วว่าง" ได้ครับ', 'info');
                        }
                    }, 300);
                }
            });
        }

        let confirmCallback = null;
        function showConfirm(title, msg, onConfirm) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            confirmCallback = onConfirm;
            document.getElementById('confirm-modal').style.display = 'flex';
        }
        function closeConfirmModal() {
            document.getElementById('confirm-modal').style.display = 'none';
            confirmCallback = null;
        }
        document.getElementById('confirm-ok-btn').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        };

        function formatPhone(input) {
            let val = input.value;
            if (val.startsWith('0')) {
                let digits = val.replace(/\D/g, '');
                if (digits.length > 3) {
                    input.value = digits.substring(0, 3) + '-' + digits.substring(3, 10);
                } else {
                    input.value = digits;
                }
            }
        }
    </script>
